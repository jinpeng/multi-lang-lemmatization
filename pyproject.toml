[project]
name = "lemma-api"
version = "0.1.0"
description = "Multilingual lemmatization HTTP API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "cryptography>=43",
    "argon2-cffi>=23",
    "simplemma>=1.2",
    "lemminflect>=0.2.3",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru>=2.4",
    "sudachipy>=0.6.10",
    "sudachidict_core>=20240716",
    "kiwipiepy>=0.20",
    "kiwipiepy_model>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "httpx2>=2.16",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: downloads or loads large dictionaries (ja, ko)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Documentation lives in docs/ and contains illustrative Python inside markdown
# fences. `ruff format` rewrites those blocks, which silently edits the plans.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
